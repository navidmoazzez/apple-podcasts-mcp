name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  smoke:
    # The build passing says nothing about whether the server actually starts
    # and lists its tools, which is the failure a user would actually hit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Server starts and lists every tool
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const listed = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2);
                const tools = listed?.result?.tools ?? [];
                console.log(`tools: ${tools.length}`);
                if (tools.length !== 32) {
                  console.error(`expected 32 tools, got ${tools.length}`);
                  process.exit(1);
                }
                const unannotated = tools.filter(t => t.annotations?.readOnlyHint === undefined);
                if (unannotated.length) {
                  console.error("unannotated: " + unannotated.map(t => t.name).join(", "));
                  process.exit(1);
                }
              });
            '

      - name: Switching the library off hides that whole group
        env:
          APPLE_PODCASTS_LIBRARY: "0"
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const tools = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2).result.tools;
                const leaked = tools.filter(t => t.name.includes("library") || t.name === "list_subscriptions" || t.name === "export_subscriptions");
                if (leaked.length) {
                  console.error("library tools exposed: " + leaked.map(t => t.name).join(", "));
                  process.exit(1);
                }
                console.log(`tools without library: ${tools.length}`);
                if (tools.length !== 25) {
                  console.error(`expected 25, got ${tools.length}`);
                  process.exit(1);
                }
              });
            '

      - name: Read-only mode hides every write
        env:
          APPLE_PODCASTS_READ_ONLY: "1"
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const tools = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2).result.tools;
                const writes = tools.filter(t => !t.annotations.readOnlyHint);
                if (writes.length) {
                  console.error("writes exposed in read-only mode: " + writes.map(t => t.name).join(", "));
                  process.exit(1);
                }
                console.log(`read-only tools: ${tools.length}`);
              });
            '

      - name: The one write refuses without confirm
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"export_subscriptions","arguments":{"path":"/tmp/ci.opml"}}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const called = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 3);
                const text = called?.result?.content?.[0]?.text ?? "";
                if (!called?.result?.isError || !text.includes("confirm: true")) {
                  console.error("export_subscriptions did not refuse without confirm");
                  process.exit(1);
                }
                console.log("write guard holds");
              });
            '

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apple-podcasts-mcp:ci .
